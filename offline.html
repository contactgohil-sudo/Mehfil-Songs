<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehfil Offline</title>
  <meta name="theme-color" content="#111827" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      color: #6b7280;
      line-height: 1.5;
      margin: 0 0 14px;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mehfil is offline</h1>
    <p>Your internet connection is unavailable. Reconnect and reload Mehfil.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
